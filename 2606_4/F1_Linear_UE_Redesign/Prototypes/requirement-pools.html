<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>需求池 UE 原型总览</title>
  <style>
    :root {
      --bg: #f7f7f6;
      --surface: #fff;
      --line: #e4e4e0;
      --text: #222321;
      --muted: #6f716d;
      --active: #20211f;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    button,
    a {
      font: inherit;
    }

    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr);
    }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: rgba(247, 247, 246, .94);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
    }

    .title {
      font-size: 16px;
      font-weight: 660;
      white-space: nowrap;
    }

    .tabs {
      display: inline-flex;
      gap: 6px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .tab {
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #565952;
      padding: 0 12px;
      cursor: pointer;
    }

    .tab.active {
      background: var(--active);
      color: #fff;
    }

    .meta {
      color: var(--muted);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .link {
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: #fff;
      color: #3d403b;
      text-decoration: none;
      white-space: nowrap;
    }

    .frame-wrap {
      min-height: 0;
      padding: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      display: block;
    }

    @media (max-width: 860px) {
      .topbar {
        flex-wrap: wrap;
        height: auto;
        min-height: 72px;
        padding: 10px;
      }

      .actions {
        margin-left: 0;
      }

      .frame-wrap {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title">需求池 UE 原型</div>
      <div class="tabs" aria-label="原型页面切换">
        <button class="tab active" type="button" data-page="raw">原始需求池</button>
        <button class="tab" type="button" data-page="product">产品需求池</button>
      </div>
      <div class="meta" id="pageMeta">原始需求分诊、业务判定、需求拆分。</div>
      <div class="actions">
        <a class="link" id="openPage" href="raw-pool-linear.html" target="_blank" rel="noreferrer">新窗口打开</a>
      </div>
    </header>

    <main class="frame-wrap">
      <iframe id="prototypeFrame" src="raw-pool-linear.html" title="需求池原型"></iframe>
    </main>
  </div>

  <script>
    const pages = {
      raw: {
        src: 'raw-pool-linear.html',
        meta: '原始需求分诊、业务判定、需求拆分。'
      },
      product: {
        src: 'product-pool-linear.html',
        meta: '用户故事管理、产品经理分析、排期和交付材料维护。'
      }
    };

    const frame = document.getElementById('prototypeFrame');
    const meta = document.getElementById('pageMeta');
    const openPage = document.getElementById('openPage');

    document.querySelectorAll('.tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((item) => item.classList.remove('active'));
        tab.classList.add('active');
        const page = pages[tab.dataset.page];
        frame.src = page.src;
        meta.textContent = page.meta;
        openPage.href = page.src;
      });
    });
  </script>
</body>
</html>
