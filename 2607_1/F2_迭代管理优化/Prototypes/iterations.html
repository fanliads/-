<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>迭代管理 · 2607_1</title>
  <style>
    :root{--bg:#f7f7f8;--panel:#fff;--line:#e8e8ea;--line-2:#dcdce0;--text:#202124;--muted:#74767c;--soft:#9b9da3;--accent:#5e6ad2;--accent-soft:#eef0ff;--danger:#c84e4e;--sidebar:220px;--shadow:0 22px 70px rgba(24,25,30,.16);font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:13px;overflow:hidden}button,input,textarea,select{font:inherit}button{color:inherit}
    .app{height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
    .sidebar{background:#f3f3f4;border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:680}.brand-mark{width:26px;height:26px;border-radius:8px;background:#242529;color:#fff;display:grid;place-items:center;font-size:12px}
    .workspace{font-size:11px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:12px 9px 6px}.nav{display:grid;gap:3px}
    .nav-item{height:34px;border:0;background:transparent;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 10px;color:#5d5f65;cursor:pointer;text-align:left}.nav-item:hover{background:#ebebed}.nav-item.active{background:#e4e4e7;color:#222327;font-weight:620}.nav-icon{width:16px;text-align:center}
    .sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.profile{display:flex;align-items:center;gap:10px;padding:8px}.avatar{width:28px;height:28px;border-radius:50%;background:#35363b;color:#fff;display:grid;place-items:center;font-size:11px}.profile small{display:block;color:var(--soft);margin-top:2px}
    .main{min-width:0;display:grid;grid-template-rows:48px minmax(0,1fr)}.topbar{background:rgba(255,255,255,.86);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px}.crumb{color:var(--muted)}.crumb strong{color:var(--text);font-weight:600}
    .page{min-height:0;overflow:auto;padding:24px 28px 40px}.page-head{display:flex;align-items:flex-end;margin-bottom:22px}.page-head h1{font-size:22px;letter-spacing:-.035em;margin:0 0 7px}.page-head p{margin:0;color:var(--muted)}.actions{margin-left:auto;display:flex;gap:7px}
    .btn{height:32px;border:1px solid var(--line-2);background:#fff;border-radius:7px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}.btn:hover{background:#f6f6f7}.btn.primary{background:#292a2e;color:#fff;border-color:#292a2e}.btn:disabled{opacity:.45;cursor:not-allowed}
    .table-card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}.table-tools{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:7px}.search{height:32px;min-width:240px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:#fbfbfc}.filter{height:32px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 10px;color:#606269}
    table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--soft);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafafa}td{padding:13px 14px;border-bottom:1px solid #efeff1;vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr{cursor:pointer}tbody tr:hover{background:#fafafa}.name{font-weight:620}.goal{color:var(--muted);font-size:11px;margin-top:4px;max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{font-variant-numeric:tabular-nums}.days{display:block;color:var(--soft);font-size:10px;margin-top:3px}
    .status{display:inline-flex;height:23px;align-items:center;padding:0 8px;border-radius:12px;font-size:11px;background:#f0f0f2;color:#666}.status.active{background:#eaf7f0;color:#277253}.status.plan{background:#fff7e8;color:#96661b}.status.done{background:#f0f1ff;color:#555fb0}.progress{width:100px;height:5px;background:#ececef;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:#6670d8;border-radius:5px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(20,21,25,.28);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;z-index:20}.modal-backdrop.show{display:flex;animation:fade .16s}.modal{width:560px;max-height:86vh;overflow:auto;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;box-shadow:var(--shadow)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}.modal-head h2{font-size:16px;margin:0}.close{margin-left:auto;width:28px;height:28px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--muted)}.close:hover{background:#f2f2f3}
    .form{padding:18px 20px;display:grid;gap:15px}.field label{display:block;font-size:11px;color:#65676d;margin-bottom:7px;font-weight:600}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-2);border-radius:7px;background:#fff;padding:8px 10px;outline:none;color:var(--text)}.field input:focus,.field textarea:focus{border-color:#9da4ec;box-shadow:0 0 0 3px #eef0ff}.field textarea{height:64px;resize:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .period{border:1px solid var(--line);background:#fafafa;border-radius:10px;padding:13px}.period-title{display:flex;align-items:center;margin-bottom:11px}.period-title strong{font-size:12px}.period-badge{margin-left:auto;color:#5862bb;background:#eef0ff;border:1px solid #dfe1ff;border-radius:12px;padding:3px 8px;font-size:10px}
    .presets{display:flex;gap:6px;margin-bottom:12px}.preset{height:29px;border:1px solid var(--line-2);background:#fff;border-radius:7px;padding:0 11px;cursor:pointer}.preset.active{background:#292a2e;color:#fff;border-color:#292a2e}.hint{font-size:11px;color:var(--muted);margin-top:8px}.error{font-size:11px;color:var(--danger);margin-top:7px;display:none}.error.show{display:block}
    .modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:7px;background:#fafafa}
    .toast{position:fixed;left:calc(var(--sidebar) + 50%);bottom:28px;transform:translateX(-50%) translateY(18px);background:#292a2e;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .detail{position:fixed;inset:48px 0 0 var(--sidebar);background:var(--bg);z-index:12;display:none;overflow:auto}.detail.show{display:block}.detail-inner{max-width:1060px;margin:0 auto;padding:28px}.back{border:0;background:transparent;color:var(--muted);cursor:pointer;margin-bottom:24px}.detail-title{display:flex;align-items:flex-start}.detail-title h2{font-size:27px;margin:4px 0 7px;letter-spacing:-.035em}.detail-title p{margin:0;color:var(--muted)}.detail-actions{margin-left:auto;display:flex;gap:7px}.detail-grid{margin-top:22px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.detail-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px}.detail-card small{color:var(--soft)}.detail-card strong{display:block;margin-top:7px}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-top:24px}.tab{border:0;background:transparent;padding:0 2px 10px;color:var(--muted);cursor:pointer}.tab.active{color:var(--text);border-bottom:2px solid var(--accent);font-weight:620}.empty-area{background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:14px;padding:48px;text-align:center;color:var(--muted)}
    @keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:1000px){:root{--sidebar:180px}.page{padding:20px}.detail-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">需</span>需求中枢</div>
      <div class="workspace">个人</div><nav class="nav"><button class="nav-item"><span class="nav-icon">⌂</span>我的工作</button></nav>
      <div class="workspace">需求</div><nav class="nav"><button class="nav-item"><span class="nav-icon">▤</span>原始需求</button><button class="nav-item"><span class="nav-icon">◇</span>产品需求</button></nav>
      <div class="workspace">视图</div><nav class="nav">
        <button class="nav-item" onclick="location.href='../../F1_看板视图迭代/Prototypes/kanban.html'"><span class="nav-icon">▥</span>看板视图</button>
        <button class="nav-item active"><span class="nav-icon">◴</span>迭代</button>
      </nav>
      <div class="sidebar-foot"><div class="profile"><span class="avatar">王</span><div>王晨<small>产品经理</small></div></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><span class="crumb">视图&nbsp; / &nbsp;<strong>迭代</strong></span></header>
      <section class="page">
        <div class="page-head"><div><h1>迭代管理</h1><p>规划迭代周期，组织产品需求并跟踪交付。</p></div><div class="actions"><button class="btn primary" id="newBtn">＋ 新建迭代</button></div></div>
        <div class="table-card">
          <div class="table-tools"><input class="search" placeholder="搜索迭代名称…"><button class="filter">状态⌄</button><button class="filter">团队⌄</button></div>
          <table><thead><tr><th>迭代</th><th>团队</th><th>真实周期</th><th>状态</th><th>进度</th><th>需求</th></tr></thead><tbody id="rows"></tbody></table>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modal">
    <section class="modal" role="dialog" aria-modal="true">
      <header class="modal-head"><h2>新建迭代</h2><button class="close" id="closeBtn">×</button></header>
      <div class="form">
        <div class="field"><label>迭代名称 *</label><input id="name" value="临时修复迭代"></div>
        <div class="row"><div class="field"><label>团队 *</label><select><option>产品平台组</option><option>基础体验组</option></select></div><div class="field"><label>状态</label><select><option>待启动</option><option>进行中</option></select></div></div>
        <div class="field"><label>迭代目标</label><textarea id="goal">集中处理线上阻塞问题，并完成非整周窗口内的验证发布。</textarea></div>
        <div class="period">
          <div class="period-title"><strong>迭代周期</strong><span class="period-badge" id="periodBadge">自定义 · 4 天</span></div>
          <div class="presets"><button class="preset" data-days="7">单周</button><button class="preset" data-days="14">双周</button></div>
          <div class="row">
            <div class="field"><label>开始日期 *</label><input type="date" id="start" value="2026-07-22"></div>
            <div class="field"><label>结束日期 *</label><input type="date" id="end" value="2026-07-25"></div>
          </div>
          <div class="hint" id="periodHint">起止日期均计入周期；支持任意合法日期区间。</div>
          <div class="error" id="dateError">结束日期不得早于开始日期</div>
        </div>
      </div>
      <footer class="modal-foot"><button class="btn" id="cancelBtn">取消</button><button class="btn primary" id="saveBtn">创建迭代</button></footer>
    </section>
  </div>

  <section class="detail" id="detail">
    <div class="detail-inner">
      <button class="back" id="backBtn">← 返回迭代列表</button>
      <div class="detail-title">
        <div><small id="detailStatus"></small><h2 id="detailName"></h2><p id="detailGoal"></p></div>
        <div class="detail-actions"><button class="btn" id="editBtn">编辑</button><button class="btn primary" onclick="location.href='../../F1_看板视图迭代/Prototypes/kanban.html'">查看看板 →</button></div>
      </div>
      <div class="detail-grid">
        <div class="detail-card"><small>真实周期</small><strong id="detailDate"></strong></div>
        <div class="detail-card"><small>周期天数</small><strong id="detailDays"></strong></div>
        <div class="detail-card"><small>团队</small><strong id="detailTeam"></strong></div>
        <div class="detail-card"><small>需求进度</small><strong id="detailProgress"></strong></div>
      </div>
      <div class="tabs"><button class="tab active">概览</button><button class="tab">需求</button><button class="tab">进度</button></div>
      <div class="empty-area">迭代详情使用独立全宽页面组织，不在右侧展开常驻信息栏。</div>
    </div>
  </section>
  <div class="toast" id="toast"></div>

  <script>
    const iterations=[
      {name:'2607_1 · 看板与迭代管理',goal:'完成全宽看板与灵活迭代周期升级',team:'产品平台组',start:'2026-07-20',end:'2026-08-02',days:14,status:'进行中',progress:36,reqs:8},
      {name:'临时支付链路修复',goal:'在 4 天窗口内完成修复与发布',team:'基础体验组',start:'2026-07-22',end:'2026-07-25',days:4,status:'待启动',progress:0,reqs:4},
      {name:'2607_2 · 需求分析增强',goal:'强化评估与拆分效率',team:'产品平台组',start:'2026-08-03',end:'2026-08-12',days:10,status:'待启动',progress:0,reqs:6},
      {name:'2606_4 · Linear UE',goal:'统一核心需求页面体验',team:'产品平台组',start:'2026-07-06',end:'2026-07-19',days:14,status:'已完成',progress:100,reqs:12}
    ];
    const rows=document.getElementById('rows'),modal=document.getElementById('modal'),detail=document.getElementById('detail');
    const start=document.getElementById('start'),end=document.getElementById('end'),badge=document.getElementById('periodBadge'),error=document.getElementById('dateError'),save=document.getElementById('saveBtn');
    function renderRows(){
      rows.innerHTML=iterations.map((x,i)=>`<tr data-i="${i}"><td><div class="name">${x.name}</div><div class="goal">${x.goal}</div></td><td>${x.team}</td><td class="date">${x.start} ～ ${x.end}<span class="days">${x.days} 天</span></td><td><span class="status ${x.status==='进行中'?'active':x.status==='待启动'?'plan':'done'}">${x.status}</span></td><td><div class="progress"><i style="width:${x.progress}%"></i></div><span class="days">${x.progress}%</span></td><td>${x.reqs}</td></tr>`).join('');
      rows.querySelectorAll('tr').forEach(tr=>tr.onclick=()=>openDetail(iterations[+tr.dataset.i]));
    }
    function daysBetween(a,b){if(!a||!b)return null;return Math.floor((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)+1}
    function localDateValue(date){
      const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    function updatePeriod(custom=true){
      const days=daysBetween(start.value,end.value),invalid=days!==null&&days<1;
      error.classList.toggle('show',invalid);save.disabled=invalid||!days;
      badge.textContent=invalid?'日期有误':`${custom?'自定义':'预设'} · ${days||0} 天`;
      if(custom)document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));
    }
    document.querySelectorAll('.preset').forEach(btn=>btn.onclick=()=>{
      if(!start.value){document.getElementById('periodHint').textContent='请先选择开始日期';return}
      const d=new Date(start.value+'T00:00:00');d.setDate(d.getDate()+(+btn.dataset.days)-1);end.value=localDateValue(d);
      document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('active',x===btn));updatePeriod(false);
    });
    start.onchange=()=>updatePeriod(true);end.onchange=()=>updatePeriod(true);
    function showModal(){modal.classList.add('show')}function hideModal(){modal.classList.remove('show')}
    document.getElementById('newBtn').onclick=showModal;document.getElementById('closeBtn').onclick=hideModal;document.getElementById('cancelBtn').onclick=hideModal;
    save.onclick=()=>{
      const days=daysBetween(start.value,end.value);if(days<1)return;
      iterations.splice(1,0,{name:document.getElementById('name').value||'未命名迭代',goal:document.getElementById('goal').value,team:'产品平台组',start:start.value,end:end.value,days,status:'待启动',progress:0,reqs:0});
      renderRows();hideModal();showToast(`已创建自定义周期迭代 · ${days} 天`);
    };
    function openDetail(x){
      document.getElementById('detailStatus').textContent=x.status;
      document.getElementById('detailName').textContent=x.name;document.getElementById('detailGoal').textContent=x.goal;
      document.getElementById('detailDate').textContent=`${x.start} ～ ${x.end}`;document.getElementById('detailDays').textContent=`${x.days} 天`;
      document.getElementById('detailTeam').textContent=x.team;document.getElementById('detailProgress').textContent=`${x.progress}% · ${x.reqs} 项需求`;detail.classList.add('show');
    }
    document.getElementById('backBtn').onclick=()=>detail.classList.remove('show');document.getElementById('editBtn').onclick=showModal;
    document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active')});
    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
    modal.addEventListener('click',e=>{if(e.target===modal)hideModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideModal();detail.classList.remove('show')}});
    renderRows();updatePeriod(true);
  </script>
</body>
</html>
